distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# 国内镜像 + all 版。
#
# ⚠️ 必须是 all，不能改成 bin！
# 项目用的是 Kotlin DSL（*.kts），Android Studio 的 prepareKotlinBuildScriptModel
# 任务编译脚本时需要 Gradle API 的源码。bin 版不含源码，Gradle 会去下载
# gradle-8.9-src.zip —— 该地址在 Gradle 源码里硬编码为 services.gradle.org，
# 且会 302 重定向到 github.com，国内必然超时：
#   ModuleVersionResolveException: Could not resolve gradle:gradle:8.9
#   Caused by: HttpHostConnectException → github.com:443 Connection timed out
# 改 distributionUrl 对它无效（两回事）。用 all 版本地自带源码，联网需求直接消失。
#
# 如果镜像也慢：用迅雷/浏览器多线程下载本链接，再手动放置或本地指定（见 README）。
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-8.9-all.zip
networkTimeout=10000
validateDistributionUrl=false
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
